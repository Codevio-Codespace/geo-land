<h1>{{heading}}</h1>
{{{error_block}}}
<form method="post" action="/admin/services/save" enctype="multipart/form-data">
  <input type="hidden" name="csrf" value="{{csrf}}">
  <input type="hidden" name="id" value="{{service_id}}">
  <div class="form-grid">
    <div>
      <div class="field">
        <label for="name">Service name</label>
        <input id="name" name="name" type="text" value="{{name}}" maxlength="120" required>
      </div>
      <div class="field">
        <label for="anchor">Anchor</label>
        <input id="anchor" name="anchor" type="text" value="{{anchor}}" maxlength="60" pattern="[a-z0-9\-]*">
        <span class="field-hint">Used by links like /services.html#{{anchor}} — keep it short, lowercase.</span>
      </div>
      <div class="field">
        <label for="short_scope">One-line scope (home page + register)</label>
        <input id="short_scope" name="short_scope" type="text" value="{{short_scope}}" maxlength="200">
      </div>
      <div class="field">
        <label for="scope_items">Scope items</label>
        <textarea id="scope_items" name="scope_items" maxlength="2600">{{scope_items}}</textarea>
        <span class="field-hint">One item per line, max 12 — shown as the accordion list.</span>
      </div>
      <div class="field">
        <label for="scope_paragraph">Intro paragraph (used instead of the list when no items)</label>
        <textarea id="scope_paragraph" name="scope_paragraph" maxlength="1200">{{scope_paragraph}}</textarea>
      </div>
      <div class="field">
        <label for="deliverables">Deliverables caption</label>
        <input id="deliverables" name="deliverables" type="text" value="{{deliverables}}" maxlength="300">
      </div>
    </div>
    <div>
      <div class="field">
        <span class="field-label">Service image</span>
        <div class="current-thumb">{{{current_thumb}}}</div>
        <select name="image_media_id">{{{image_options}}}</select>
      </div>
      <div class="field">
        <label for="image_upload">…or upload a new image</label>
        <input id="image_upload" name="image_upload" type="file" accept="image/jpeg,image/png,image/webp">
      </div>
      <div class="field">
        <label for="sort">Order (lower shows first)</label>
        <input id="sort" name="sort" type="number" min="1" max="999" value="{{sort}}">
      </div>
      <div class="checkbox-row">
        <label><input type="checkbox" name="published" value="1"{{published_checked}}> Shown on the website</label>
      </div>
    </div>
  </div>
  <div class="form-actions">
    <button class="btn btn--orange" type="submit">Save</button>
    <a class="btn btn--ghost" href="/admin/services">Cancel</a>
  </div>
</form>
