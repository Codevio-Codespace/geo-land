<div class="auth-page">
  <div class="auth-box">
    <p class="mono">Geo&Land Kosova — First run</p>
    <h1>Create the administrator account</h1>
    {{#error}}<p class="notice notice--err" role="alert">{{error}}</p>{{/error}}
    <p class="note">This account manages the public website content. It can only be created once.</p>
    <form method="post" action="/admin/setup">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" minlength="3" maxlength="40" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" required>
        <span class="field-hint">At least 10 characters.</span>
      </div>
      <button class="btn btn--orange" type="submit">Create account</button>
    </form>
  </div>
</div>
