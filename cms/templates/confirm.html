<h1>Delete “{{name}}”?</h1>
<p class="note">{{details}} This cannot be undone.</p>
<form method="post" action="/admin/{{action_route}}">
  <input type="hidden" name="csrf" value="{{csrf}}">
  <input type="hidden" name="id" value="{{item_id}}">
  <input type="hidden" name="do" value="delete">
  <div class="form-actions">
    <button class="btn" type="submit">Yes, delete permanently</button>
    <a class="btn btn--ghost" href="/admin/{{cancel_target}}">Cancel</a>
  </div>
</form>
